name: CI

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]

# 同一分支上的新推送取消旧运行，避免浪费 CI 资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 构建 / 测试作业：master 与 PR，WITH_VELOPACK=OFF 保持绿色 ──
  # IMAGEPRO_WERROR=ON：警告即错误，作为编译期质量门禁。
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-pkg-config

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DBUILD_TESTS=ON -DIMAGEPRO_WERROR=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j4

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ImagePro-Windows-${{ github.run_number }}
          path: |
            build/ImagePro.exe
            build/*.dll

  # ── 多架构构建矩阵 ────────────────────────────────────────────
  # 每个架构一套工具链，产出对应的安装包与便捷版。
  #
  # 架构与工具链的对应关系（均为实测可行路径）：
  #   x64      MSYS2 MINGW64（msvcrt）—— 本地开发与发布主线路
  #   x64-ucrt MSYS2 UCRT64
  #   arm64    MSYS2 CLANGARM64（aarch64，含 Qt5 与 libvips）
  #            ⚠ 必须在**原生 ARM64 Windows** 上构建：MSYS2 的 CLANGARM64
  #              前缀里连编译器都是 ARM64 原生程序，无法在 x64 上交叉编译。
  #              故该条目跑在 windows-11-arm runner 上。
  #   x86      MSVC + Qt 官方 win32_msvc2019 预编译包 + libvips 官方预编译包
  #            （MSYS2 没有 32 位 Qt，也没有 32 位 libvips）
  build-arch:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            msystem: MINGW64
            prefix: mingw-w64-x86_64
          - arch: x64-ucrt
            os: windows-latest
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            variant: ucrt
          - arch: arm64
            os: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
          - arch: x86
            os: windows-latest
            msvc: true
            qt_arch: win32_msvc2019
            vips_url: https://github.com/lovell/sharp-libvips/releases/download/v8.16.1/libvips-8.16.1-win32-ia32.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── MSVC 路线（x86）──
      - name: Setup MSVC (x86)
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Qt (${{ matrix.qt_arch }})
        if: matrix.msvc
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 ${{ matrix.qt_arch }} `
                  --outputdir "${{ env.RUNNER_TEMP }}\qt"
          # aqt 解到 <outputdir>/<version>/<arch>，这一层即 Qt 根目录。
          $qtRoot = (Get-ChildItem "${{ env.RUNNER_TEMP }}\qt" -Directory -Recurse |
                     Where-Object { $_.Name -eq ${{ matrix.qt_arch }} } |
                     Select-Object -First 1).Parent.FullName
          "CMAKE_PREFIX_PATH=$qtRoot" >> $env:GITHUB_ENV
          "QT_ROOT_DIR=$qtRoot" >> $env:GITHUB_ENV
          Write-Host "Qt root: $qtRoot"

      - name: Install libvips (x86 prebuilt)
        if: matrix.msvc
        shell: pwsh
        run: |
          $vipsDir = "${{ env.RUNNER_TEMP }}\libvips"
          New-Item -ItemType Directory -Force -Path $vipsDir | Out-Null
          $tgz = "${{ env.RUNNER_TEMP }}\vips.tar.gz"
          Invoke-WebRequest -Uri "${{ matrix.vips_url }}" -OutFile $tgz
          tar -xzf $tgz -C $vipsDir
          "IMAGEPRO_VIPS_ROOT=$vipsDir" >> $env:GITHUB_ENV
          Write-Host "libvips root: $vipsDir"

      # CPack 的 NSIS 生成器在自己的 PATH / 注册表里找 makensis，
      # 只设 CPACK_NSIS_MAKE_NSIS 不够（它还要定位 NSIS 的 Plugins/Include）。
      - name: Ensure NSIS on PATH
        if: matrix.msvc
        shell: pwsh
        run: |
          $nsisDirs = @(
            "$env:ProgramFiles(x86)\NSIS",
            "$env:ProgramFiles\NSIS",
            "C:\msys64\mingw64\bin"
          ) | Where-Object { Test-Path "$_\makensis.exe" }
          if (-not $nsisDirs) { throw "找不到 makensis" }
          "PATH=$($nsisDirs -join ';');$env:PATH" >> $env:GITHUB_ENV
          Write-Host "NSIS: $($nsisDirs -join ', ')"

      # 生成器用 Visual Studio 而不是 Ninja：
      # 中文 VS 下 cl.exe 的 /showIncludes 前缀是「注意: 包含文件:」，
      # CMake 会把它写进 rules.ninja 的 msvc_deps_prefix，
      # 而 Ninja 的词法器不接受非 ASCII 字节 →
      #   rules.ninja: expected newline, got lexing error
      # 该前缀由 VS 安装语言决定，VSLANG=1033 也改不动。
      - name: Configure (${{ matrix.arch }}, MSVC)
        if: matrix.msvc
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 `
                -DBUILD_TESTS=ON `
                -DIMAGEPRO_WERROR=ON `
                "-DCMAKE_PREFIX_PATH=$env:CMAKE_PREFIX_PATH" `
                "-DIMAGEPRO_VIPS_ROOT=$env:IMAGEPRO_VIPS_ROOT"

      - name: Build (${{ matrix.arch }}, MSVC)
        if: matrix.msvc
        shell: pwsh
        run: cmake --build build --config Release -j4

      - name: Test (${{ matrix.arch }}, MSVC)
        if: matrix.msvc
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (${{ matrix.arch }}, MSVC)
        if: matrix.msvc
        shell: pwsh
        run: |
          cd build
          cpack -G ZIP -B package -C Release
          cpack -G NSIS -B package -C Release
          cmake --build . --config Release --target portable

      # ── MSYS2 路线（x64 / x64-ucrt / arm64）──
      - name: Setup MSYS2 (${{ matrix.msystem }})
        if: ${{ !matrix.msvc }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-qt5
            ${{ matrix.prefix }}-qt5-tools
            ${{ matrix.prefix }}-libvips
            ${{ matrix.prefix }}-pkg-config
            ${{ matrix.prefix }}-nsis

      # shell 写 `msys2 {0}` 即可：{0} 会替换成本作业 setup-msys2 的 msystem 输入，
      # 因此矩阵里每个架构条目都自动进入对应的 MSYS2 环境
      # （MINGW64 / UCRT64 / CLANGARM64），无需在 shell 里再引用矩阵变量。
      - name: Configure (${{ matrix.arch }})
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DBUILD_TESTS=ON -DIMAGEPRO_WERROR=ON \
                -DCMAKE_PREFIX_PATH="/${{ matrix.prefix }}" \
                -DCMAKE_INSTALL_PREFIX="/${{ matrix.prefix }}" \
                ${{ matrix.variant && format('-DIMAGEPRO_PACKAGE_VARIANT={0}', matrix.variant) || '' }}

      - name: Build (${{ matrix.arch }})
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: cmake --build build -j4

      - name: Test (${{ matrix.arch }})
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Package (${{ matrix.arch }})
        if: ${{ !matrix.msvc }}
        shell: msys2 {0}
        run: |
          cd build
          cpack -G ZIP -B package
          cpack -G NSIS -B package
          cmake --build . --target portable

      # 产物名用 ArchPackages- 前缀：与其它作业的 artifact 区分开，
      # 发布作业据此精确下载多架构产物（避免误收同名 artifact）。
      - name: Upload Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ArchPackages-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/package/*
            build/*-portable-*.zip

  # ── 格式门禁：clang-format 检查 ─────────────────────────────────
  # 格式标准的唯一来源是仓库根目录的 .clang-format。
  # 任何与标准不符的改动都会让本作业失败，避免格式噪音进入主干。
  format:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-clang-tools-extra

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DBUILD_TESTS=OFF

      - name: Format check
        shell: msys2 {0}
        run: cmake --build build --target format-check

  # ── 静态分析门禁：clang-tidy ────────────────────────────────────
  # 与 build 一样是阻断门禁：任何告警都让作业失败。
  # 工具链必须与编译器一致（都用 MSYS2 的 MinGW），
  # 否则 clang-tidy 无法解析 /mingw64/include 下的 Qt 头文件。
  static-analysis:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-clang-tools-extra

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DBUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        shell: msys2 {0}
        run: cmake --build build --target tidy

  # ── Velopack ABI 门禁 ──────────────────────────────────────────
  # 以 -DWITH_VELOPACK=ON 完整编译一次：链接通过即说明 VpkUpdateManager
  # 使用的 C++ API 符号与 velopack_libc DLL 一致（ABI 正确）。
  # 此前只有 tag 构建才覆盖这条路径，ABI 破坏会等到发版才发现。
  velopack-abi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-tools-git

      - name: Download & extract Velopack libc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod "https://api.github.com/repos/velopack/velopack/releases/latest" `
                   -Headers @{ "User-Agent" = "github-actions" }
          $asset = $rel.assets | Where-Object { $_.name -like "velopack_libc_*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "velopack_libc zip not found in latest release." }
          Invoke-WebRequest $asset.browser_download_url -OutFile velopack_libc.zip -UseBasicParsing
          Expand-Archive velopack_libc.zip -DestinationPath velopack-libc -Force

      - name: Configure (WITH_VELOPACK=ON)
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DBUILD_TESTS=OFF -DIMAGEPRO_WERROR=ON \
            -DWITH_VELOPACK=ON \
            -DVELOPACK_ROOT="$GITHUB_WORKSPACE/velopack-libc"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j4

  # ── 打包门禁：CPack 生成 ZIP 与 NSIS 安装程序 ───────────────────
  # 验证安装规则与 NSIS 脚本配置在 CI 里真实可用，
  # 而不是只在配置阶段「看起来没问题」。
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-nsis

      - name: Configure
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DBUILD_TESTS=OFF -DIMAGEPRO_WERROR=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j4

      - name: Pack (ZIP + NSIS)
        shell: msys2 {0}
        run: |
          cd build
          cpack -G ZIP
          cpack -G NSIS

      - name: Verify artifacts
        shell: msys2 {0}
        run: |
          ls -la build/package/ || ls -la build/*.exe build/*.zip
          echo "--- artifacts ---"
          find build -maxdepth 2 -name "*.zip" -o -maxdepth 2 -name "*.exe" | grep -v "^build/ImagePro.exe$"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImagePro-Packages-${{ github.run_number }}
          path: |
            build/*.zip
            build/*.exe
            build/package/*

  # ── 发布作业：tag 触发，WITH_VELOPACK=ON + vpk pack 上传 Releases ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # 发布前必须过门禁：格式、静态分析、多架构构建都绿了才发版。
    needs: [format, static-analysis, build-arch]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Setup MSYS2
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt5
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-libvips
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-tools-git

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download & extract Velopack libc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod "https://api.github.com/repos/velopack/velopack/releases/latest" `
                   -Headers @{ "User-Agent" = "github-actions" }
          $asset = $rel.assets | Where-Object { $_.name -like "velopack_libc_*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "velopack_libc zip not found in latest release." }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest $asset.browser_download_url -OutFile velopack_libc.zip -UseBasicParsing
          Expand-Archive velopack_libc.zip -DestinationPath velopack-libc -Force
          Write-Host "VELOPACK_ROOT = $env:GITHUB_WORKSPACE/velopack-libc"
          Get-ChildItem velopack-libc -Recurse -Depth 1 | Select-Object FullName

      - name: Configure (WITH_VELOPACK=ON)
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DBUILD_TESTS=OFF \
            -DIMAGEPRO_WERROR=ON \
            -DWITH_VELOPACK=ON \
            -DVELOPACK_ROOT="$GITHUB_WORKSPACE/velopack-libc"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build -j4

      - name: Assemble deploy directory
        shell: pwsh
        env:
          MSYS2_LOC: ${{ steps.msys.outputs.msys2-location }}
        run: |
          # setup-msys2 的安装位置不固定（非 C:/msys64），用其输出定位 mingw64/bin。
          $msys = $env:MSYS2_LOC
          Write-Host "MSYS2 location: $msys"
          $env:PATH = "$msys/mingw64/bin;$env:PATH"
          ./deploy.ps1 -BuildDir build -DeployDir deploy -MsysRoot $msys -SourceRoot .

      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch previous release assets (for delta generation)
        shell: pwsh
        continue-on-error: true
        run: |
          # 下载到**独立目录**，不要放进 releases/：
          # releases/ 是本次发布的输出目录，里面只应放新产物。
          # 混在一起的话，上个版本的 Setup.exe / Portable.zip 会随新版本一起
          # 被上传，Release 页面里就混进了旧版安装包。
          New-Item -ItemType Directory -Force -Path releases-prev | Out-Null
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            -o releases-prev `
            --token ${{ secrets.GITHUB_TOKEN }}
          Write-Host "Previous assets (if any):"
          Get-ChildItem releases-prev -ErrorAction SilentlyContinue | Select-Object Name

      - name: vpk pack
        shell: pwsh
        run: |
          vpk pack `
            --packId ImagePro `
            --packVersion ${{ env.VERSION }} `
            --packDir deploy `
            --mainExe ImagePro.exe `
            --packTitle "影图" `
            --packAuthors "yingtu" `
            --icon resources/icons/app.ico `
            --splashImage resources/installer/splash.png `
            --msi `
            --instLocation PerMachine `
            --msiVersion ${{ env.VERSION }}.0 `
            -o releases
          Write-Host "Release assets (before rename):"
          Get-ChildItem releases | Select-Object Name, Length

      - name: Rename assets to 项目名+平台+版本号 format
        shell: pwsh
        run: |
          # 将 Setup.exe / Portable.zip / .msi 重命名为 ImagePro-win-<版本号>-XXX 格式。
          # nupkg / releases.win.json / RELEASES 保持原名（Velopack 依赖）。
          # 同时更新 assets.win.json 使其与实际文件名一致，避免 404。
          $ver = "${{ env.VERSION }}"
          $newSetup = "ImagePro-win-${ver}-Setup.exe"
          $newPortable = "ImagePro-win-${ver}-Portable.zip"
          $newMsi = "ImagePro-win-${ver}-Setup.msi"
          $setup = "releases\ImagePro-win-Setup.exe"
          $portable = "releases\ImagePro-win-Portable.zip"
          if (Test-Path $setup) {
            Rename-Item $setup $newSetup
            Write-Host "Renamed Setup -> $newSetup"
          }
          if (Test-Path $portable) {
            Rename-Item $portable $newPortable
            Write-Host "Renamed Portable -> $newPortable"
          }
          # MSI（vpk --msi 生成）：原始文件名不确定，按通配抓取后统一改名
          $msi = Get-ChildItem releases -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $origMsi = $msi.Name
            Rename-Item $msi.FullName $newMsi
            Write-Host "Renamed MSI ($origMsi) -> $newMsi"
          }
          # 同步更新 assets.win.json（含 .msi 条目，防御式同步）
          $assetsPath = "releases\assets.win.json"
          if (Test-Path $assetsPath) {
            $assets = Get-Content $assetsPath -Raw | ConvertFrom-Json
            foreach ($a in $assets) {
              if ($a.RelativeFileName -eq "ImagePro-win-Setup.exe")
                { $a.RelativeFileName = $newSetup }
              elseif ($a.RelativeFileName -eq "ImagePro-win-Portable.zip")
                { $a.RelativeFileName = $newPortable }
              elseif ($a.RelativeFileName -like "*.msi")
                { $a.RelativeFileName = $newMsi }
            }
            $assets | ConvertTo-Json -Compress | Set-Content $assetsPath -Encoding UTF8
            Write-Host "Updated assets.win.json to match renamed files"
          }
          Write-Host "Release assets (final):"
          Get-ChildItem releases | Select-Object Name, Length

      # 多架构产物：把 x64 / x64-ucrt / x86 / arm64 各自的 NSIS 安装包与便捷版
      # 一并挂到 Release —— 这才是「多架构发布版本」的落点。
      # 文件名已带架构标识（win64 / win64-ucrt / win32 / winarm64），四个变体互不重名。
      - name: Download multi-arch packages
        uses: actions/download-artifact@v4
        with:
          pattern: ArchPackages-*
          path: arch-packages

      - name: Collect multi-arch assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Get-ChildItem arch-packages -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object {
              Copy-Item $_.FullName (Join-Path 'releases' $_.Name) -Force
              Write-Host "multi-arch asset: $($_.Name)"
            }
          Write-Host "Release assets (with multi-arch):"
          Get-ChildItem releases | Select-Object Name, Length

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          files: releases/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
